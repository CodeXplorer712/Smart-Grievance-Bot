<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanitation Login — Grievance System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="sanitation-login.css">
</head>

<body>
  <div class="login-card">
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#fff" viewBox="0 0 16 16">
        <path
          d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92z" />
      </svg>
    </div>
    <h4 class="text-center mb-1">Sanitation Department</h4>
    <p class="text-muted text-center mb-4">Solapur Municipal Corporation</p>
    <div class="mb-3">
      <input type="text" class="form-control" id="username" placeholder="Username">
    </div>
    <div class="mb-3 position-relative">
      <input type="password" class="form-control" id="password" placeholder="Password">
      <button type="button" class="toggle-password" id="togglePassword">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#888" class="eye-icon" viewBox="0 0 16 16">
          <path
            d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
          <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
        </svg>
      </button>
    </div>
    <div id="errorMsg" class="mb-3" style="display:none;">Invalid username or password</div>
    <button type="button" class="btn btn-primary w-100" id="loginBtn">Login</button>
  </div>

  <script src="sanitation-login.js"></script>
</body>

</html>
