<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Grievance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-login.css">
</head>
<body>
    <div class="card">
        <div class="text-center mb-3">
            <div class="icon-circle">🏛️</div>
        </div>
        <h4 class="text-center mb-1">Admin Panel</h4>
        <p class="text-center text-muted mb-4">Solapur Municipal Corporation</p>
        <form id="loginForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password">
            </div>
            <div id="errorMsg" hidden>Invalid username or password</div>
            <button type="button" id="loginBtn" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
    <script src="admin-login.js"></script>
</body>
</html>
